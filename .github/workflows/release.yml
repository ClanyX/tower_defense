name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: tower_defense

jobs:
  build-release:
    name: Build production version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_suffix: linux
            binary_name: tower_defense
            zip_suffix: linux
          - os: windows-latest
            artifact_suffix: windows
            binary_name: tower_defense.exe
            zip_suffix: windows

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-cache-${{ matrix.os }}

      - name: Install system dependencies for Bevy (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev

      - name: Compilation (Release build)
        run: cargo build --release

      - name: Folder & App & Assets
        shell: bash
        run: |
          mkdir -p dist
          # Copy binary
          cp target/release/${{ matrix.binary_name }} dist/

          # Copy assets
          if [ -d "assets" ]; then cp -r assets dist/; fi

          # Copy doc and lic
          if [ -f "README.md" ]; then cp README.md dist/; fi
          if [ -f "LICENSE" ]; then cp LICENSE dist/; fi

      - name: Upload app as the Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}
          path: dist/
          retention-days: 30

      - name: Create zip archive (Linux)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd dist
          zip -r ../${{ env.APP_NAME }}-${{ matrix.zip_suffix }}.zip .
          cd ..

      - name: Create zip archive (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd dist
          7z a -r ../${{ env.APP_NAME }}-${{ matrix.zip_suffix }}.zip *
          cd ..

      - name: Publication to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-${{ matrix.zip_suffix }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
